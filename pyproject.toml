[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedwell"
version = "0.1.0a1"
description = "All social media clients suck. This one just sucks less."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jeffrey 'Alex' Clark"},
]

dependencies = [
    "django>=6.1,<6.2",
    "django-mongodb-backend>=6.1,<6.2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/aclark4life/feedwell"
Repository = "https://github.com/aclark4life/feedwell"
Issues = "https://github.com/aclark4life/feedwell/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-django>=4.8.0",
    "pre-commit>=3.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[project.scripts]
feedwell = "feedwell.app:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/feedwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "feedwell.settings"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
